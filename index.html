<!DOCTYPE html>
<html lang="en" data-theme="auto" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CineScope AI — Should you watch it?</title>
  <meta name="description" content="CineScope AI blends IMDb, Rotten Tomatoes, Metacritic, TMDb and Letterboxd into one verdict, with real content advisories, so you know before you press play.">
  <meta name="theme-color" content="#08090d">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__glow backdrop__glow--a"></div>
    <div class="backdrop__glow backdrop__glow--b"></div>
    <div class="backdrop__grain"></div>
    <div class="backdrop__scrim"></div>
  </div>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" data-nav>
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="4.5" width="19" height="15" rx="3"></rect>
          <path d="M2.5 9h19M2.5 15h19M7 4.5v15M17 4.5v15"></path>
          <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <span class="brand__text">
        <strong>CineScope</strong>
        <em>AI</em>
      </span>
    </a>

    <nav class="topbar__nav" aria-label="Main">
      <a class="navlink" href="#/" data-nav>Discover</a>
      <a class="navlink" href="#/list" data-nav>
        Watchlist <span class="navlink__count" id="nav-watchlist-count" hidden>0</span>
      </a>
      <a class="navlink" href="#/compare" data-nav>Compare</a>
    </nav>

    <div class="topbar__actions">
      <button class="search-trigger" id="search-trigger" type="button" aria-haspopup="dialog" aria-label="Search films">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
        </svg>
        <span>Search a film</span>
        <kbd>⌘K</kbd>
      </button>
      <button class="iconbtn" id="sound-toggle" type="button" aria-pressed="false" title="Interface sound">
        <span class="iconbtn__on">🔊</span><span class="iconbtn__off">🔇</span>
      </button>
      <button class="iconbtn" id="install-btn" type="button" hidden>⬇️</button>
      <button class="iconbtn" id="settings-btn" type="button" aria-label="Settings" title="Settings">⚙️</button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <section class="view" id="view-landing" hidden></section>
    <section class="view" id="view-report" hidden></section>
    <section class="view" id="view-compare" hidden></section>
    <section class="view" id="view-list" hidden></section>
  </main>

  <footer class="footer">
    <p>CineScope AI — verdicts built from published ratings, never invented ones. Catalogue data is bundled; add a TMDb key for the full catalogue.</p>
    <p class="footer__meta">
      <span id="footer-source">Offline-ready</span> ·
      <button class="linkbtn" id="footer-shortcuts" type="button">Keyboard shortcuts</button> ·
      <button class="linkbtn" id="footer-privacy" type="button">Your data stays local</button>
    </p>
  </footer>

  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="palette-root" id="palette-root" hidden></div>
  <div class="gate-root" id="gate-root" hidden></div>
</body>
</html>
